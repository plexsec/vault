name: PlexVault
options:
  bundleIdPrefix: com.plexsec
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  groupSortPosition: top
  generateEmptyDirectories: false

settings:
  base:
    SWIFT_VERSION: "5.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_STRICT_CONCURRENCY: minimal
    # Deterministic-ish build inputs for the reproducible-build story.
    GCC_TREAT_WARNINGS_AS_ERRORS: NO
    SWIFT_TREAT_WARNINGS_AS_ERRORS: NO

packages:
  VaultKit:
    path: Packages/VaultKit
  YubikeyKit:
    path: Packages/YubikeyKit

targets:
  PlexVault:
    type: application
    platform: iOS
    sources:
      - path: PlexVault
      # The simulated card is the same implementation the package tests use, but compiled into
      # the app target rather than linked as a package product: linking it as a product left its
      # symbols in the shipped binary. It is compiled into Release as well as Debug, because the
      # App Store build has to be reviewable without a YubiKey (amendment 51) — what Release
      # leaves out is the DEBUG-only test apparatus around it, not the card itself.
      - path: Packages/YubikeyKit/Sources/YubikeyKitMock/MockYubikeyTransport.swift
      # A real signature by the deterministic key the DEBUG simulated card is
      # provisioned with, generated by tools/derive. DEBUG-only, so Release never
      # sees it; tools/verify.sh regenerates and diffs it.
      - path: Packages/YubikeyKit/Sources/YubikeyKitMock/SimulatedSigningVectors.swift
    dependencies:
      - package: VaultKit
        product: VaultKit
      - package: YubikeyKit
        product: YubikeyKit
      - package: YubikeyKit
        product: YubikeyKitNFC
      - package: YubikeyKit
        product: YubikeyKitCCID
    info:
      path: PlexVault/Info.plist
      properties:
        CFBundleDisplayName: PlexVault
        # One source of truth for the version: the plist carries the build settings rather
        # than a second literal, so the App Store's version and the project's cannot drift.
        # The first published version is 1.0 (build 1).
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        ITSAppUsesNonExemptEncryption: false
        UIRequiresFullScreen: true
        UIApplicationSupportsIndirectInputEvents: true
        UILaunchScreen:
          UIColorName: ""
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # CoreNFC needs a usage string AND the OpenPGP AID declared, otherwise iOS
        # will not surface the YubiKey to the reader session at all.
        NFCReaderUsageDescription: >-
          PlexVault talks to your YubiKey over NFC to provision it. No data leaves
          this device.
        com.apple.developer.nfc.readersession.iso7816.select-identifiers:
          - D27600012401
        # The signing flow reads the wallet's request from an animated QR code, so
        # the camera is an input channel. It is used for nothing else: no frames
        # are stored, and nothing leaves the device (tools/audit-release.sh checks
        # that the app has no networking, and that its one persisted value — the
        # card connection — is the non-secret preference it is allowed).
        NSCameraUsageDescription: >-
          PlexVault uses the camera to read the unsigned transaction your wallet
          shows as a QR code. Nothing is recorded and nothing leaves this device.
        # Saving the record to Photos is an explicit, add-only write the operator asks
        # for. The app never reads the library, and what it writes is the public
        # record they are already told to keep.
        NSPhotoLibraryAddUsageDescription: >-
          PlexVault saves the provisioning record to your photo library as an image.
          It never reads your photos.
    entitlements:
      path: PlexVault/PlexVault.entitlements
      properties:
        com.apple.developer.nfc.readersession.formats:
          - TAG
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.plexsec.vault
        PRODUCT_NAME: PlexVault
        # The icon comes from Assets.xcassets/AppIcon.appiconset. Set explicitly:
        # XcodeGen does not infer it from the catalog, and without it the built
        # app ships with a blank icon.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CURRENT_PROJECT_VERSION: "1"
        MARKETING_VERSION: "1.0"
        CODE_SIGN_STYLE: Automatic
        # The paid organisation team the app is released under (PLEXSEC LIMITED).
        # Its distribution certificate is what signs the App Store build.
        DEVELOPMENT_TEAM: "WSL242UF2M"
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        # Release builds must not contain the DEBUG-only simulated card.
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: ""
      configs:
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
          SWIFT_OPTIMIZATION_LEVEL: "-Onone"
        Release:
          SWIFT_COMPILATION_MODE: wholemodule
          SWIFT_OPTIMIZATION_LEVEL: "-O"
          DEAD_CODE_STRIPPING: YES
          # The App Store build carries the simulated card, and says so by name: REVIEW_DEMO
          # compiles the demo transport in and leaves every DEBUG-only hook —
          # `-deterministic-entropy`, `-simulated-cards`, `-simulated-touch-delay-ms`,
          # `-reset-simulated-card` — out (amendment 51, and check 1 of
          # tools/audit-release.sh, which asserts both halves). `MockYubikeyTransport.swift`
          # compiles here; `SimulatedSigningVectors.swift` is `#if DEBUG` inside and still
          # contributes nothing, which is why the demo card cannot produce a valid signature.
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "REVIEW_DEMO"

  # UI tests drive the real app in a simulator, so the setup screen and the
  # ceremony's step gating are covered by automation rather than by hand.
  PlexVaultUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: PlexVaultUITests
    dependencies:
      - target: PlexVault
      # The UI tests compute the expected mnemonic and back-fill challenge with the
      # same library the app uses, so they assert the *wiring* rather than
      # re-deriving the crypto.
      - package: VaultKit
        product: VaultKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.plexsec.vault.uitests
        TEST_TARGET_NAME: PlexVault
        CODE_SIGN_STYLE: Automatic
        # Device signing needs an Info.plist for the test runner too; the simulator does not
        # ask for one, which is why this only came up when the tests were first run on a
        # phone.
        GENERATE_INFOPLIST_FILE: YES
        # The same personal team as the app: without it the test runner cannot be installed
        # on a device, and these tests are the only place the camera is exercised at all
        # (a simulator has none).
        DEVELOPMENT_TEAM: "WSL242UF2M"

schemes:
  PlexVault:
    build:
      targets:
        PlexVault: all
        PlexVaultUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - PlexVaultUITests
    archive:
      config: Release
